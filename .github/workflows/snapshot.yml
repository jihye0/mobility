# 매시간 Apps Script API에서 데이터를 받아 data.json 스냅샷으로 저장합니다.
# 첫 방문자도 Apps Script 응답을 기다리지 않고 GitHub CDN에서 바로 데이터를 받게 됩니다.
# (Actions 탭에서 "Run workflow"로 수동 실행도 가능)
name: Update data.json snapshot

on:
  schedule:
    - cron: "0 * * * *"      # 매시 정각(UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from Apps Script API
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('config.js', 'utf8'), sandbox);
          const url = String(sandbox.window.APP_CONFIG && sandbox.window.APP_CONFIG.API_URL || '').trim();
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(url)) {
            console.log('config.js 의 API_URL 이 설정되지 않아 스냅샷을 건너뜁니다.');
            process.exit(0);
          }
          (async () => {
            const res = await fetch(url + '?action=data', { redirect: 'follow' });
            const text = await res.text();
            let data;
            try { data = JSON.parse(text); } catch (e) { throw new Error('JSON 파싱 실패: ' + text.slice(0, 200)); }
            if (!data || !Array.isArray(data.programs)) throw new Error('programs 배열이 없습니다: ' + text.slice(0, 200));
            delete data.generatedAt; // 매번 바뀌는 값은 제외해 불필요한 커밋 방지
            fs.writeFileSync('data.json', JSON.stringify(data));
            console.log(data.programs.length + '건 저장');
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

      - name: Commit if changed
        run: |
          if [ ! -f data.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "chore: update data.json snapshot" && git push)
